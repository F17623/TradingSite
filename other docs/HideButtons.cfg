# HideButtons.cfg: настройки напоминаний в Telegram.
# Файл перечитывается сам примерно раз в 2 секунды, перезапуск NinjaTrader не нужен.
# Формат: ключ = значение. Всё после # игнорируется.

# Слать напоминания, пока сделка открыта (true / false)
ReminderEnabled = true

# Как часто слать напоминание, в минутах (целое число 1..1440).
# Первое напоминание приходит через столько же минут после входа.
ReminderIntervalMinutes = 3

# Учитывать Sim-счета (true - для тестов на симе, false - на реальных счетах)
ReminderIncludeSim = false

# Пауза после выхода из позиции, секунды (целое 0..3600)
CooldownSeconds = 30

# То же для счетов-исключений, секунды
CooldownSecondsExempt = 30

BotMasterAccount = Sim101
BotCloseConfirm = true
BotBreakevenTicks = 0

# Бот «Статус» в Telegram (true / false)
BotEnabled = true

# Что показывает окно замка: day = до конца торгового дня, число = пауза в минутах (1..720), asia = блок Азии.
# Не больше 8 пунктов, порядок как в списке.
LockOptions = day, 15, 30, 60, asia

# Текст внизу панели, по одной строке. Начало red: делает строку красной.
# Если строк нет, берутся стандартные. Символ # в тексте использовать нельзя.
PanelLine = 💡 Don't be sloppy
PanelLine = red: 🎯 Не двигай СТОП !!!
PanelLine = 📈 Проверь графики и камеру, копировщик
PanelLine = ⚠ Ещё одна сделка всё портит

# Паузы после выхода (CooldownSeconds, CooldownSecondsExempt): теперь 0..600 секунд.
# Увеличить можно сразу. Уменьшить можно только после перезапуска NinjaTrader.