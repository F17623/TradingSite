<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Универсальный компонент тегов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 p-8 flex flex-col items-center min-h-screen">

    <div class="w-full max-w-4xl space-y-6">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold text-slate-200">Песочница с универсальным TagPicker</h1>
            <button onclick="addTradeCard()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow">
                + Добавить карточку
            </button>
        </div>

        <div id="trades-list" class="space-y-4"></div>
    </div>

    <script>
        // ==========================================
        // 1. ГЛОБАЛЬНЫЙ МЕНЕДЖЕР ИСТОРИИ ТЕГОВ
        // ==========================================
        const TagHistory = {
            storageKey: 'trading_journal_tag_history',
            
            get() {
                const saved = localStorage.getItem(this.storageKey);
                return saved ? JSON.parse(saved) : [
                    '500t', '5m_at_mid', 'tick_25%', 'tick_below_mid', 'tick_trend_down',
                    'ema_bounce', 'trend_day', 'breakout', '3000t', 'chop_day',
                    'fvg', 'ob', 'liquidity_sweep', 'asia', 'london', 'ny_open'
                ];
            },

            add(tag) {
                let history = this.get();
                const exists = history.some(t => t.toLowerCase() === tag.toLowerCase());
                if (!exists) {
                    history.push(tag);
                    localStorage.setItem(this.storageKey, JSON.stringify(history));
                }
            }
        };

        // ==========================================
        // 2. УНИВЕРСАЛЬНЫЙ КОМПОНЕНТ TAGPICKER
        // ==========================================
        class TagPicker {
            constructor({ container, selectedTags = [], onChange }) {
                this.container = typeof container === 'string' ? document.getElementById(container) : container;
                this.selectedTags = [...selectedTags];
                this.onChange = onChange || (() => {});
                
                this.initUI();
                this.bindEvents();
                this.renderBadges();
            }

            initUI() {
                this.container.className = "flex items-center gap-3 bg-slate-950/60 border border-slate-800/80 rounded-lg p-2.5 w-full";
                this.container.innerHTML = `
                    <span class="text-xs font-bold text-slate-400 tracking-wider shrink-0">ТЕГИ:</span>
                    <div class="badges-container custom-scrollbar flex items-center gap-2 overflow-x-auto whitespace-nowrap flex-grow py-0.5 min-w-0"></div>
                    <div class="relative shrink-0 input-wrapper">
                        <div class="flex items-center gap-1.5">
                            <input type="text"
                                   placeholder="+ новый..."
                                   autocomplete="off"
                                   class="tag-input bg-slate-900/90 border border-slate-700/60 hover:border-slate-600 focus:border-blue-500 rounded px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 outline-none w-28 transition-colors">
                            <button type="button"
                                    class="toggle-btn shrink-0 px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 font-medium transition-colors">
                                ▼
                            </button>
                        </div>
                        <div class="dropdown-menu hidden absolute right-0 top-full mt-1.5 w-56 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-hidden">
                            <div class="px-3 py-2 border-b border-slate-800 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">
                                Выберите теги
                            </div>
                            <div class="dropdown-list max-h-52 overflow-y-auto custom-scrollbar py-1"></div>
                            <div class="px-3 py-2 border-t border-slate-800 bg-slate-950/50 text-[10px] text-slate-500">
                                Enter — добавить новый тег
                            </div>
                        </div>
                    </div>
                `;

                this.badgesContainer = this.container.querySelector('.badges-container');
                this.inputWrapper = this.container.querySelector('.input-wrapper');
                this.input = this.container.querySelector('.tag-input');
                this.toggleBtn = this.container.querySelector('.toggle-btn');
                this.dropdown = this.container.querySelector('.dropdown-menu');
                this.dropdownList = this.container.querySelector('.dropdown-list');
            }

            isSelected(tagName) {
                return this.selectedTags.some(t => t.toLowerCase() === tagName.toLowerCase());
            }

            toggleTag(tagName) {
                const idx = this.selectedTags.findIndex(t => t.toLowerCase() === tagName.toLowerCase());
                if (idx >= 0) {
                    this.selectedTags.splice(idx, 1);
                } else {
                    this.selectedTags.push(tagName);
                    TagHistory.add(tagName);
                }
                this.renderBadges();
                this.renderCheckboxList(this.input.value);
                this.onChange(this.selectedTags);
                setTimeout(() => { this.badgesContainer.scrollLeft = this.badgesContainer.scrollWidth; }, 20);
            }

            renderBadges() {
                this.badgesContainer.innerHTML = '';
                this.selectedTags.forEach((tag, idx) => {
                    const badge = document.createElement('span');
                    badge.className = "shrink-0 inline-flex items-center gap-1.5 bg-blue-950/90 text-blue-300 text-xs px-2.5 py-1 rounded-md border border-blue-800/60 font-medium";
                    badge.innerHTML = `
                        <span>${tag}</span>
                        <button type="button" class="text-blue-400 hover:text-white transition-colors font-bold leading-none">&times;</button>
                    `;
                    badge.querySelector('button').onclick = (e) => {
                        e.stopPropagation();
                        this.selectedTags.splice(idx, 1);
                        this.renderBadges();
                        this.renderCheckboxList(this.input.value);
                        this.onChange(this.selectedTags);
                    };
                    this.badgesContainer.appendChild(badge);
                });
            }

            renderCheckboxList(filter = '') {
                const history = TagHistory.get();
                const q = (filter || '').toLowerCase().trim();
                const allTags = [...new Set([...history, ...this.selectedTags])];

                const filtered = allTags.filter(t => !q || t.toLowerCase().includes(q));

                filtered.sort((a, b) => {
                    const aSel = this.isSelected(a) ? 0 : 1;
                    const bSel = this.isSelected(b) ? 0 : 1;
                    return aSel !== bSel ? aSel - bSel : a.localeCompare(b);
                });

                this.dropdownList.innerHTML = '';

                if (filtered.length === 0) {
                    this.dropdownList.innerHTML = `<div class="px-3 py-3 text-xs text-slate-500 text-center">Нет подходящих тегов</div>`;
                    return;
                }

                filtered.forEach(tag => {
                    const checked = this.isSelected(tag);
                    const row = document.createElement('label');
                    row.className = `flex items-center gap-2.5 px-3 py-2 text-xs cursor-pointer hover:bg-slate-800/80 transition-colors ${checked ? "text-blue-300" : "text-slate-300"}`;

                    row.innerHTML = `
                        <input type="checkbox" class="rounded border-slate-600 bg-slate-900 text-blue-500 focus:ring-0 focus:ring-offset-0 w-3.5 h-3.5" ${checked ? 'checked' : ''}>
                        <span class="font-mono">#${tag}</span>
                    `;

                    const checkbox = row.querySelector('input');
                    checkbox.onchange = (e) => {
                        e.stopPropagation();
                        this.toggleTag(tag);
                    };

                    row.onclick = (e) => {
                        if (e.target === checkbox) return;
                        e.preventDefault();
                        checkbox.checked = !checkbox.checked;
                        this.toggleTag(tag);
                    };

                    this.dropdownList.appendChild(row);
                });
            }

            openDropdown() {
                this.renderCheckboxList(this.input.value);
                this.dropdown.classList.remove('hidden');
            }

            closeDropdown() {
                this.dropdown.classList.add('hidden');
            }

            bindEvents() {
                this.toggleBtn.onclick = (e) => {
                    e.stopPropagation();
                    this.dropdown.classList.contains('hidden') ? this.openDropdown() : this.closeDropdown();
                };

                this.input.onfocus = () => this.openDropdown();
                this.input.oninput = () => {
                    this.renderCheckboxList(this.input.value);
                    this.dropdown.classList.remove('hidden');
                };

                this.input.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ',') {
                        e.preventDefault();
                        const val = this.input.value.trim().replace(/[^a-zA-Z0-9%_\-]/g, '');
                        if (val && !this.isSelected(val)) {
                            this.toggleTag(val);
                        }
                        this.input.value = '';
                        this.renderCheckboxList('');
                    } else if (e.key === 'Escape') {
                        this.closeDropdown();
                        this.input.blur();
                    }
                };

                document.addEventListener('click', (e) => {
                    if (!this.inputWrapper.contains(e.target)) {
                        this.closeDropdown();
                    }
                });

                this.badgesContainer.onwheel = (e) => {
                    if (e.deltaY !== 0) {
                        e.preventDefault();
                        this.badgesContainer.scrollLeft += e.deltaY;
                    }
                };
            }
        }

        // ==========================================
        // 3. ПРИМЕР ИСПОЛЬЗОВАНИЯ В КАРТОЧКАХ СДЕЛОК
        // ==========================================
        let tradesData = [
            { id: 120, type: 'LONG', symbol: 'NQ DEC26', account: 'APEX628630000007', pnl: '+$60.00', ticks: '+12 t', tags: ['500t', '5m_at_mid', 'tick_25%'] },
            { id: 121, type: 'SHORT', symbol: 'ES DEC26', account: 'APEX628630000007', pnl: '-$25.00', ticks: '-5 t', tags: ['3000t', 'chop_day'] }
        ];

        function renderTrades() {
            const listContainer = document.getElementById('trades-list');
            listContainer.innerHTML = '';

            tradesData.forEach((trade) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl w-full";

                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-3">
                            <span class="bg-slate-800 text-slate-300 font-mono text-xs px-2.5 py-1 rounded border border-slate-700">#${trade.id}</span>
                            <span class="bg-emerald-950 text-emerald-400 font-bold text-xs px-2.5 py-1 rounded border border-emerald-800/60">${trade.type} ▲</span>
                            <span class="font-bold text-slate-100">${trade.symbol}</span>
                            <span class="text-xs text-slate-400">Счета: ${trade.account} (1 контр.)</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-xs text-slate-400">06:48:58 PM</span>
                            <span class="text-emerald-400 font-semibold text-sm">${trade.ticks}</span>
                            <span class="text-emerald-400 font-bold text-sm">${trade.pnl}</span>
                        </div>
                    </div>

                    <!-- Контейнер под теги -->
                    <div id="tag-picker-${trade.id}"></div>
                `;

                listContainer.appendChild(card);

                // Инициализация компонента тегов в 1 строку:
                new TagPicker({
                    container: `#tag-picker-${trade.id}`,
                    selectedTags: trade.tags,
                    onChange: (updatedTags) => {
                        trade.tags = updatedTags; // Синхронизация с вашими данными/Supabase
                    }
                });
            });
        }

        window.addTradeCard = function() {
            const newId = tradesData.length > 0 ? tradesData[tradesData.length - 1].id + 1 : 120;
            tradesData.push({
                id: newId,
                type: Math.random() > 0.5 ? 'LONG' : 'SHORT',
                symbol: 'NQ DEC26',
                account: 'APEX628630000007',
                pnl: '+$45.00',
                ticks: '+9 t',
                tags: []
            });
            renderTrades();
        };

        renderTrades();
    </script>
</body>
</html>
