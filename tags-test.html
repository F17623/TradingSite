<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест тегов в карточке сделки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 p-8 flex flex-col items-center min-h-screen">

    <div class="w-full max-w-4xl space-y-6">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold text-slate-200">Песочница карточек сделок с тегами</h1>
            <button onclick="addTradeCard()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors shadow">
                + Добавить карточку для теста скролла
            </button>
        </div>

        <!-- Контейнер со списком сделок -->
        <div id="trades-list" class="space-y-4">
            <!-- Сюда динамически рендерятся карточки -->
        </div>
    </div>

    <script>
        // Глобальный список автозаполнения (храним в localStorage браузера)
		// Получение истории тегов из localStorage
		function getSavedHistoryTags() {
			const saved = localStorage.getItem('trading_journal_tag_history');
			// Если пусто, возвращаем базовый набор, чтобы было с чем работать
			return saved ? JSON.parse(saved) : ['500t', '5m_at_mid', 'tick_25%', 'tick_below_mid', 'tick_trend_down', 'ema_bounce', 'trend_day', 'breakout'];
		}

		function saveHistoryTag(tag) {
			let history = getSavedHistoryTags();
			if (!history.includes(tag)) {
				history.push(tag);
				localStorage.setItem('trading_journal_tag_history', JSON.stringify(history));
			}
		}

        // Демо-данные для карточек
        let tradesData = [
            { id: 120, type: 'LONG', symbol: 'NQ DEC26', account: 'APEX628630000007', pnl: '+$60.00', ticks: '+12 t', tags: ['500t', '5m_at_mid', 'tick_25%', 'tick_below_mid', 'tick_trend_down'] },
            { id: 121, type: 'SHORT', symbol: 'ES DEC26', account: 'APEX628630000007', pnl: '-$25.00', ticks: '-5 t', tags: ['3000t', 'chop_day'] }
        ];

        function renderTrades() {
            const listContainer = document.getElementById('trades-list');
            listContainer.innerHTML = '';

            tradesData.forEach((trade, tradeIndex) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl w-full transition-all";
                
                card.innerHTML = `
                    <!-- Верхняя шапка сделки -->
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-3">
                            <span class="bg-slate-800 text-slate-300 font-mono text-xs px-2.5 py-1 rounded border border-slate-700">#${trade.id}</span>
                            <span class="bg-emerald-950 text-emerald-400 font-bold text-xs px-2.5 py-1 rounded border border-emerald-800/60">${trade.type} ▲</span>
                            <span class="font-bold text-slate-100">${trade.symbol}</span>
                            <span class="text-xs text-slate-400">Счета: ${trade.account} (1 контр.)</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-xs text-slate-400">06:48:58 PM</span>
                            <span class="text-emerald-400 font-semibold text-sm">${trade.ticks}</span>
                            <span class="text-emerald-400 font-bold text-sm">${trade.pnl}</span>
                        </div>
                    </div>

                    <!-- Блок тегов на всю ширину -->
                    <div class="flex items-center gap-3 bg-slate-950/60 border border-slate-800/80 rounded-lg p-2.5">
                        <span class="text-xs font-bold text-slate-400 tracking-wider shrink-0">ТЕГИ:</span>
                        
                        <!-- Скролл только для бейджей (без overflow на родителе инпута) -->
                        <div id="tag-container-${tradeIndex}" class="custom-scrollbar flex items-center gap-2 overflow-x-auto whitespace-nowrap flex-grow py-0.5 min-w-0">
                            <!-- Бейджи тегов вставляются сюда -->
                        </div>

                        <!-- Инпут + дропдаун ВНЕ overflow-контейнера -->
                        <div class="relative shrink-0" id="input-wrapper-${tradeIndex}">
                            <input type="text" 
                                   id="tag-input-${tradeIndex}" 
                                   placeholder="+ добавить тег..." 
                                   autocomplete="off"
                                   class="bg-slate-900/90 border border-slate-700/60 hover:border-slate-600 focus:border-blue-500 rounded px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 outline-none w-32 transition-colors">
                            
                            <div id="dropdown-${tradeIndex}" class="hidden absolute left-0 top-full mt-1.5 w-52 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl z-50 max-h-48 overflow-y-auto custom-scrollbar"></div>
                        </div>
                    </div>
                `;

                listContainer.appendChild(card);
                initTagInput(tradeIndex);
            });
        }

        function initTagInput(tradeIndex) {
            const trade = tradesData[tradeIndex];
            const container = document.getElementById(`tag-container-${tradeIndex}`);
            const inputWrapper = document.getElementById(`input-wrapper-${tradeIndex}`);
            const input = document.getElementById(`tag-input-${tradeIndex}`);
            const dropdown = document.getElementById(`dropdown-${tradeIndex}`);

            function renderBadges() {
                // Полностью перерисовываем бейджи внутри scroll-контейнера
                container.innerHTML = '';

                trade.tags.forEach((tag, tIdx) => {
                    const badge = document.createElement('span');
                    badge.className = "tag-badge shrink-0 inline-flex items-center gap-1.5 bg-blue-950/90 text-blue-300 text-xs px-2.5 py-1 rounded-md border border-blue-800/60 font-medium";
                    badge.innerHTML = `
                        <span>${tag}</span>
                        <button type="button" onclick="removeTradeTag(${tradeIndex}, ${tIdx})" class="text-blue-400 hover:text-white transition-colors font-bold leading-none">&times;</button>
                    `;
                    container.appendChild(badge);
                });
            }

            function showDropdown(filter = '') {
                const history = getSavedHistoryTags();
                const q = (filter || '').toLowerCase().trim();

                // Регистронезависимый фильтр + не показываем уже выбранные теги
                const filtered = history.filter(t => {
                    const tagLower = String(t).toLowerCase();
                    const already = trade.tags.some(ex => String(ex).toLowerCase() === tagLower);
                    return !already && (q === '' || tagLower.includes(q));
                });

                if (filtered.length === 0) {
                    dropdown.classList.add('hidden');
                    return;
                }

                dropdown.innerHTML = '';
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "px-3 py-2 text-xs text-slate-300 hover:bg-blue-600 hover:text-white cursor-pointer transition-colors border-b border-slate-800/50 last:border-none";
                    div.textContent = '#' + item;
                    div.onmousedown = (e) => {
                        e.preventDefault(); // не даём input потерять фокус
                        addTagToTrade(tradeIndex, item);
                    };
                    dropdown.appendChild(div);
                });

                dropdown.classList.remove('hidden');
            }

            function addTagToTrade(tIdx, val) {
                const clean = String(val).trim().replace(/[^a-zA-Z0-9%_\-]/g, '');
                if (!clean) return;

                const already = tradesData[tIdx].tags.some(t => String(t).toLowerCase() === clean.toLowerCase());
                if (already) return;

                tradesData[tIdx].tags.push(clean);
                saveHistoryTag(clean);
                renderBadges();
                input.value = '';
                dropdown.classList.add('hidden');

                setTimeout(() => { container.scrollLeft = container.scrollWidth; }, 30);
            }

            window.removeTradeTag = function(tIdx, tagIdx) {
                tradesData[tIdx].tags.splice(tagIdx, 1);
                renderTrades();
            };

            // события — только один раз
            input.addEventListener('focus', () => showDropdown(input.value));
            input.addEventListener('input', (e) => showDropdown(e.target.value));
            input.addEventListener('blur', () => {
                setTimeout(() => dropdown.classList.add('hidden'), 200);
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ',') {
                    e.preventDefault();
                    if (input.value.trim()) {
                        addTagToTrade(tradeIndex, input.value);
                    }
                } else if (e.key === 'Backspace' && input.value === '' && trade.tags.length > 0) {
                    trade.tags.pop();
                    renderBadges();
                }
            });

            // Горизонтальный скролл колесиком
            container.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY;
                }
            });

            renderBadges();
        }

        window.addTradeCard = function() {
            const newId = tradesData.length > 0 ? tradesData[tradesData.length - 1].id + 1 : 120; 
            tradesData.push({
                id: newId,
                type: Math.random() > 0.5 ? 'LONG' : 'SHORT',
                symbol: 'NQ DEC26',
                account: 'APEX628630000007',
                pnl: '+$45.00',
                ticks: '+9 t',
                tags: ['500t']
            });
            renderTrades();
        }

        renderTrades();
    </script>
</body>
</html>
